# When a pull request is merged to main: bump the version, tag it, publish to PyPI
# and create a GitHub release.
#
# The bump size comes from the pull request's labels:
#   release:major  1.2.3 -> 2.0.0
#   release:minor  1.2.3 -> 1.3.0
#   (no label)     1.2.3 -> 1.2.4
#   release:skip   no release
# Pushes to main that don't come from a pull request are not released.
name: Release

on:
  push:
    branches: [main]

# One release at a time, so two quick merges can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # The release commit itself is pushed with GITHUB_TOKEN, which never triggers
    # workflows; this check is a second guard against a release loop.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    permissions:
      contents: write # push the version commit and tag
      pull-requests: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Find the merged pull request and the bump size
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
          if [ -z "$pr" ]; then
            echo "No merged pull request for $GITHUB_SHA; not releasing."
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          labels=" $(jq -r '[.labels[].name] | join(" ")' <<<"$pr") "
          case "$labels" in
            *" release:skip "*) bump="" ;;
            *" release:major "*) bump=major ;;
            *" release:minor "*) bump=minor ;;
            *) bump=patch ;;
          esac
          echo "Pull request #$number, labels:$labels-> bump: ${bump:-none}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.bump != ''
        with:
          ref: main
          persist-credentials: false # the token is only handed to the push below

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.pr.outputs.bump != ''
        with:
          enable-cache: false

      - name: Test
        if: steps.pr.outputs.bump != ''
        run: |
          uv sync --locked
          uv run pytest -s

      - name: Bump version, commit and tag
        id: release
        if: steps.pr.outputs.bump != ''
        env:
          BUMP: ${{ steps.pr.outputs.bump }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv version --bump "$BUMP"
          tag="v$(uv version --short)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $tag" -m "Released from #$PR_NUMBER."
          git tag "$tag"
          git push --atomic "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # A separate job so a failed upload can be re-run on its own ("Re-run failed jobs")
  # and publishes the same tag again instead of bumping the version a second time.
  publish:
    needs: bump
    if: needs.bump.outputs.tag != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nafnagreining/
    permissions:
      contents: write # create the GitHub release
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
