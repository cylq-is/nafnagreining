[project]
name = "nafnagreining"
version = "0.1.0"
description = "Icelandic language detection and extraction of person names, places and locations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-SA-3.0"
license-files = ["LICENSE", "src/nafnagreining/data/LICENSE-wordlist.txt"]
authors = [{ name = "cylq-is", email = "cylq@proton.me" }]
keywords = ["icelandic", "íslenska", "ner", "named-entity-recognition", "language-detection", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Icelandic",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["islenska>=2.1,<3"]

[project.urls]
Homepage = "https://github.com/cylq-is/nafnagreining"
Issues = "https://github.com/cylq-is/nafnagreining/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
